<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>조건 렌더링 디렉티브</title>
</head>
<body>
<div id="app">
    예금액 : <input id="a" type="text" v-model="amount" />
    <img src="htts://contactsvc.bmaster.kro.kr/img/error.png" 
     v-show="amount < 0" title="마이너스는 허용하지 않습니다" 
     style="width:15px; height:15px; vertical-align:middle">
</div>
<script type="text/javascript" src="https://unpkg.com/vue"></script>
<script type="text/javascript">
    var vm = Vue.createApp({
        data() {
            return { amount : "" };
    },
    }).mount("#app");
</script>
</body>
</html>
