<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vue 디렉티브</title>
</head>
<body>
<!-- 
    vue 디렉티브는 템플릿 안에 사용하는 v-로 시작하는 속성
    html 요소와 관련된 작업 지정 가능

    v-text, {{}} : innerText 속성에 연결\, 태그 문자열을 html 인코딩하여 나타내기 때문에 화면에 태그 문자열 그대로 노출
    v-html : innerHTML 속성에 연결, 태그 문자열을 파싱하여 화면에 나타냄
-->
    <div id="app">
        <h2 v-text="message"></h2>
    </div>
    <script type="text/javascript" src="https://unpkg.com/vue"></script>
    <script type="text/javascript">
        var model = {message : "Hello Vue3!!"};
        var vm = Vue.createApp({
            name : "App",
            data() {
                return model;
            }
        }).mount("#app");
    </script>
</body>
</html>
